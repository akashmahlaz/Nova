[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
dashmap = "6.2.1"
dotenvy = "0.15.7"
garde = { version = "0.23.0", features = ["derive"] }
geo-types = { version = "0.7.20", features = ["serde"] }
geozero = { version = "0.15.1", default-features = false, features = ["with-postgis-sqlx", "with-geo"] }
h3o = "0.11.1"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = "9.3"
phonenumber = "0.3.10"
rand = "0.10.3"
redis = { version = "1.8.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", features = ["form", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout", "request-id", "limit", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "danger-credential-internals", "conditional-ui", "resident-key-support"] }
webauthn-rs-proto = "0.5"
